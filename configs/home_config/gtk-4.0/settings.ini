# Akira アキラ — GTK4 settings
# configs/gtk-4.0/settings.ini  ->  ~/.config/gtk-4.0/settings.ini
#
# Static: no colors here, those live in gtk-4.0/gtk.css.
#
# libadwaita ignores gtk-theme-name, so it is left out. Font, icons and cursor
# still apply, and prefer-dark matters: without it libadwaita mixes its own
# light values into everything gtk.css does not override.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=JetBrains Mono 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
