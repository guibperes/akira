# Akira アキラ — hyprlock
# configs/hypr/hyprlock.conf
#
# Static: hyprlang has variables, so only colors.conf is
# generated. Everything here references those variables.

source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $akira_bg
    blur_passes = 2
    blur_size = 6
    brightness = 0.8
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 0

    outer_color = $akira_border
    inner_color = $akira_bg_dark
    font_color = $akira_fg
    check_color = $akira_border_hi
    fail_color = $akira_red
    capslock_color = $akira_yellow

    placeholder_text = <span foreground="##565f89">アキラ</span>
    fail_text = <span foreground="##f7768e">$FAIL</span>
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    position = 0, -60
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $akira_fg
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $akira_comment
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
