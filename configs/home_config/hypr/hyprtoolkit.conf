# Akira アキラ — hyprtoolkit
# configs/hypr/hyprtoolkit.conf
#
# Static: hyprlang has variables, so only colors.conf is generated.
#
# hyprtoolkit is the GUI toolkit behind several Hypr ecosystem apps
# (hyprshutdown, hyprlauncher and others). This single file themes
# all of them — there is no per-app theme.

source = ~/.config/hypr/colors.conf

# ── Surfaces ─────────────────────────────────────────────────
background = $akira_bg
base = $akira_bg_alt
alternate_base = $akira_surface

# ── Text ─────────────────────────────────────────────────────
text = $akira_fg
bright_text = $akira_fg_bright

# ── Accents ──────────────────────────────────────────────────
accent = $akira_accent
accent_secondary = $akira_blue

# ── Typography ───────────────────────────────────────────────
font_family = JetBrainsMono Nerd Font
font_size = 12
h1_size = 20
h2_size = 15
h3_size = 13

# ── Borders ──────────────────────────────────────────────────
rounding_large = 0
rounding_small = 0
