# Akira アキラ — GTK3 settings
# configs/gtk-3.0/settings.ini  ->  ~/.config/gtk-3.0/settings.ini
#
# Static: no colors here, only which theme, font and icons to use.
#
# This duplicates the gsettings keys on purpose. Applications disagree about
# where to look: some read dconf through gsettings, some read this file, and
# outside a GNOME session neither can be assumed. Setting both is the only
# reliable option.

[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=JetBrains Mono 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
