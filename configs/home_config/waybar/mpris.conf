# akira-mpris configuration
#
# Sourced as a shell fragment by bin/akira-mpris. Environment variables
# set on the command line take precedence over the values here, so
# `WIDTH=25 DELAY=0.15 akira-mpris` still works for quick tests.

# Visible characters of the title
WIDTH=35

# Seconds between frames, lower scrolls faster
DELAY=0.25

# playerctl is queried every N frames (4 x 0.25s = once per second)
POLL_FRAMES=4

# Shown between the end of the title and its restart
GAP="  ·  "

# Comma separated, passed to playerctl --ignore-player
IGNORED_PLAYERS="discord"

# Shown in place of the player icon while paused
PAUSED_ICON=""

# Icon per player name, as reported by `playerctl -l`
declare -A PLAYER_ICONS=(
  [default]=""
  [chromium]=""
  [spotify]=""
  [spotify_player]=""
  [mpv]=""
  [vlc]="󰕼"
)
